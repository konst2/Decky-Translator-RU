name: Build and Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g., v0.7.2). Leave empty for dev build only.'
        required: false
        type: string

jobs:
  # Backend unit tests (tests/). Separate job so that build waits for it:
  # failing tests stop both the dev build and the release.
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 3.11 on purpose: main.py and py_modules/providers/ run inside the Decky
      # Loader process, which is Python 3.11 (unlike the 3.13 workers below).
      - name: Setup Python 3.11
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Same script as locally; TEST_PYTHON replaces pyenv, which CI does not have
      - name: Run backend tests
        env:
          TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./run-tests.sh -v

  build:
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      sha256: ${{ steps.dependencies_hash.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        env:
          # The version badge on the main tab is baked into the bundle; pass the
          # release version explicitly, because package.json is updated later.
          PLUGIN_VERSION: ${{ inputs.release_version }}
        run: pnpm run build

      - name: Download Decky CLI
        run: |
          mkdir -p cli
          curl -L -o cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64"
          chmod +x cli/decky

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Create dependencies directory
        run: mkdir -p dependencies_build

      - name: Install Python packages (Python 3.13)
        run: |
          pip install -r requirements.txt -t dependencies_build/py_modules --no-cache-dir --no-deps

      - name: Install cp311 packages for Decky Loader runtime
        run: |
          pip install -r requirements-main.txt -t dependencies_build/py_modules --no-cache-dir --python-version 3.11 --only-binary=:all: --platform manylinux_2_28_x86_64 --no-deps

      - name: Verify pinned package set and dependencies
        run: |
          # --no-deps installs only what the lock lists, so the wheel set cannot
          # drift on its own. The flip side: a dependency missing from the lock
          # is silently not installed. This step checks both directions:
          #   1. every installed package is pinned, every pin is installed, and
          #      the versions match (typos, unpinned lines);
          #   2. every Requires-Dist of every installed package is installed
          #      in a satisfying version, unless it is listed below as skipped
          #      on purpose (a forgotten transitive dependency fails here).
          # Markers are evaluated for this runner (CPython 3.13, x86_64 Linux),
          # the same target as the bundled worker runtime. `packaging` is
          # installed into the runner only, not into the archive.
          python -m pip install --quiet --no-cache-dir packaging==26.3
          python - <<'PY'
          from importlib.metadata import distributions
          from pathlib import Path

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          # (package, dependency) -> why it is not installed.
          INTENTIONALLY_SKIPPED = {
              ("ctranslate2", "numpy"):
                  "imported only by model converters, not by translation",
              ("ctranslate2", "pyyaml"):
                  "imported only by model converters, not by translation",
          }

          def pins(path):
              out = {}
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  name, sep, version = line.partition("==")
                  if not sep or not version:
                      raise SystemExit(f"not pinned: {line!r} in {path}")
                  out[canonicalize_name(name)] = version
              return out

          expected = pins("requirements.txt") | pins("requirements-main.txt")
          dists = {canonicalize_name(d.metadata["Name"]): d
                   for d in distributions(path=["dependencies_build/py_modules"])}
          installed = {name: d.version for name, d in dists.items()}

          problems = []
          for name, version in sorted(expected.items()):
              if installed.get(name) != version:
                  problems.append(f"{name}: pinned {version}, installed {installed.get(name)}")
          for name in sorted(set(installed) - set(expected)):
              problems.append(f"{name}: installed but not pinned")

          used_skips = set()
          for name, dist in sorted(dists.items()):
              for line in dist.requires or []:
                  req = Requirement(line)
                  if req.marker is not None and not req.marker.evaluate({"extra": ""}):
                      continue  # optional extra or another platform
                  dep = canonicalize_name(req.name)
                  if (name, dep) in INTENTIONALLY_SKIPPED:
                      used_skips.add((name, dep))
                      continue
                  have = installed.get(dep)
                  if have is None:
                      problems.append(f"{name} requires {req}, which is not in the lock")
                  elif not req.specifier.contains(have, prereleases=True):
                      problems.append(f"{name} requires {req}, but the lock has {dep}=={have}")

          # A stale exception would hide the dependency if it ever came back.
          for pair in sorted(set(INTENTIONALLY_SKIPPED) - used_skips):
              problems.append(f"skip {pair} is no longer needed: remove it")

          if problems:
              raise SystemExit("dependency check failed:\n  " + "\n  ".join(problems))
          print(f"pinned package set ok: {len(installed)} packages, "
                f"{len(used_skips)} dependencies skipped on purpose")
          PY

      - name: Strip unnecessary packages and test files
        run: |
          cd dependencies_build/py_modules
          # RapidOCR (OpenCV + onnxruntime) is optional and not installed here;
          # see requirements.txt. The provider code stays in the plugin.
          # Strip test directories, __pycache__, and .pyc files
          find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "testing" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          find . -name "*.pyi" -delete 2>/dev/null || true
          rm -rf numpy/_pyinstaller
          # The ctranslate2 extension module ships with debug info: 69 MB, of
          # which 1.8 MB is code (about 9 MB of the compressed archive).
          # Only this one file is stripped, and only with --strip-debug, which
          # removes debug sections and leaves symbols alone. Running
          # --strip-unneeded over every .so was tried and is NOT safe: with
          # binutils 2.40 it broke numpy's OpenBLAS ("ELF load command
          # address/offset not page-aligned"). The smoke test below imports
          # ctranslate2, so a damaged file fails the build.
          strip --strip-debug ctranslate2/_ext*.so
          echo "py_modules size after cleanup: $(du -sh . | cut -f1)"

      - name: Drop CUDA kernels from ctranslate2
        run: |
          # The ctranslate2 wheel embeds GPU code for NVIDIA cards in the ELF
          # section .nv_fatbin (~15 MB, ~11 MB of the compressed archive). The
          # plugin always creates its translator with device="cpu" and the
          # Steam Deck has an AMD GPU, so this code is never parsed. The bytes
          # are overwritten with zeros in place: file size, section table and
          # offsets stay the same, only the archive compresses better.
          # Checked on ctranslate2 4.9.0: import, get_cuda_device_count() == 0
          # and a CPU translation give the same result as the original library.
          # The build fails if the section is missing or ambiguous, so a
          # ctranslate2 upgrade with a different layout is noticed here.
          python - dependencies_build/py_modules/ctranslate2.libs/libctranslate2*.so* <<'PY'
          import struct
          import sys

          paths = sys.argv[1:]
          if len(paths) != 1:
              raise SystemExit(f"expected one libctranslate2, found: {paths}")
          path = paths[0]
          data = bytearray(open(path, "rb").read())

          # ELF64 little-endian header: e_shoff at 0x28; e_shentsize, e_shnum,
          # e_shstrndx at 0x3A. Wheels for x86_64 Linux are always ELF64 LE.
          if data[:6] != b"\x7fELF\x02\x01":
              raise SystemExit(f"{path}: not an ELF64 little-endian file")
          section_table_offset, = struct.unpack_from("<Q", data, 0x28)
          entry_size, entry_count, names_index = struct.unpack_from("<HHH", data, 0x3A)

          def section(index):
              # Elf64_Shdr: name, type, flags, addr, offset, size, ...
              fields = struct.unpack_from("<IIQQQQ", data, section_table_offset + index * entry_size)
              name_offset, section_type, _flags, _addr, offset, size = fields
              return name_offset, section_type, offset, size

          names_offset = section(names_index)[2]

          def section_name(name_offset):
              start = names_offset + name_offset
              return bytes(data[start:data.index(b"\0", start)])

          SHT_NOBITS = 8  # a section without bytes in the file
          matches = []
          for index in range(entry_count):
              name_offset, section_type, offset, size = section(index)
              if section_name(name_offset) == b".nv_fatbin" and section_type != SHT_NOBITS:
                  matches.append((offset, size))
          if len(matches) != 1:
              raise SystemExit(f"{path}: expected one .nv_fatbin section, found {len(matches)}")

          offset, size = matches[0]
          data[offset:offset + size] = bytes(size)
          open(path, "wb").write(data)
          print(f"zeroed .nv_fatbin: {size / 1e6:.1f} MB in {path}")
          PY

      - name: Download Python 3.13 portable runtime
        run: |
          mkdir -p dependencies_build/python313
          curl -L -o dependencies_build/python313/python-3.13.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260408/cpython-3.13.13%2B20260408-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          echo "a1dbc39f9c7b7d4ff3074fa18de66714c4e4400643bd657894a65803b0362a92  dependencies_build/python313/python-3.13.tar.gz" | sha256sum -c
          cd dependencies_build/python313 && tar -xzf python-3.13.tar.gz && rm python-3.13.tar.gz

      - name: Trim bundled Python runtime
        run: |
          cd dependencies_build/python313/python
          # bin/python3.13 is a static build, so workers never load the shared
          # libpython; the .so and its embedding symlink are dead weight.
          rm -f lib/libpython3.13.so.1.0 lib/libpython3.so
          # pip, IDLE, Tk/Tcl and headers are not used by the OCR/translation
          # workers. Keep the rest of the stdlib: asyncio/unittest/email and
          # friends are imported by third-party packages.
          rm -rf lib/python3.13/site-packages lib/python3.13/ensurepip \
                 lib/python3.13/idlelib lib/python3.13/tkinter \
                 lib/python3.13/turtledemo lib/python3.13/turtle.py \
                 lib/python3.13/pydoc_data lib/python3.13/config-3.13-* \
                 lib/tcl9.0 lib/tcl9 lib/tk9.0 lib/itcl4.3.5 \
                 lib/libtcl9.0.so lib/libtcl9tk9.0.so lib/libtcl9itcl4.3.5.so \
                 include share
          rm -f bin/pip bin/pip3 bin/pip3.13 bin/idle3.13 bin/pydoc3.13 \
                bin/python3.13-config lib/python3.13/lib-dynload/_tkinter*
          echo "python313 size after trim: $(du -sh . | cut -f1)"

      - name: Smoke-test bundled Python and packages
        run: |
          # Uses exactly the runtime and packages that go into the archive, so
          # a broken trim or a damaged library fails the build instead of the
          # Deck. The generated protobuf modules are imported too: their
          # runtime version check is the first thing a protobuf upgrade breaks.
          # ctranslate2 is asked about devices and CPU compute types: this
          # loads the library with the zeroed CUDA section and initialises its
          # CUDA runtime, the place where that change could fail.
          PYTHONPATH=dependencies_build/py_modules:py_modules \
            dependencies_build/python313/python/bin/python3.13 - <<'PY'
          import PIL, requests, urllib3, google.protobuf
          import ctranslate2, sentencepiece
          import providers.chromescreenai_protos.chrome_screen_ai_pb2
          import sentencepiece.sentencepiece_model_pb2
          assert ctranslate2.get_cuda_device_count() == 0
          print("ctranslate2 cpu compute types:",
                sorted(ctranslate2.get_supported_compute_types("cpu")))
          print("bundled runtime imports ok")
          PY

      - name: Create dependencies archive
        run: |
          # xz -9e makes the archive about a third smaller than gzip. Decky
          # Loader (3.2.x on Python 3.11 and 3.3.x on Python 3.14) bundles
          # lzma, so main.py unpacks it with the standard tarfile module.
          # -T1: one thread gives one xz block, which compresses best;
          # -9e needs ~700 MB of RAM, fine on the runner.
          set -o pipefail
          cd dependencies_build
          tar -cf - py_modules python313 | xz -9e -T1 > ../plugin-dependencies.tar.xz
          echo "dependencies archive: $(du -h ../plugin-dependencies.tar.xz | cut -f1)"

      - name: Calculate dependencies SHA256
        id: dependencies_hash
        run: |
          HASH=$(sha256sum plugin-dependencies.tar.xz | cut -d' ' -f1)
          echo "sha256=$HASH" >> $GITHUB_OUTPUT
          echo "Dependencies SHA256: $HASH"

      - name: Get version
        id: version
        run: |
          if [[ -n "${{ inputs.release_version }}" ]]; then
            VERSION="${{ inputs.release_version }}"
            IS_RELEASE="true"
          else
            VERSION="dev-$(echo ${{ github.sha }} | cut -c1-7)"
            IS_RELEASE="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (is_release: $IS_RELEASE)"

      - name: Update package.json with release values
        if: steps.version.outputs.is_release == 'true'
        run: |
          sed -i -E "s#\"version\": \"[0-9]+\.[0-9]+\.[0-9]+\"#\"version\": \"${{ steps.version.outputs.version }}\"#g" package.json
          sed -i -E "s#/download/(__VERSION__|v?[0-9]+\.[0-9]+\.[0-9]+|dev-[a-f0-9]+)/#/download/${{ steps.version.outputs.version }}/#g" package.json
          sed -i -E "s#\"sha256hash\": \"(__SHA256__|[a-f0-9]{64})\"#\"sha256hash\": \"${{ steps.dependencies_hash.outputs.sha256 }}\"#g" package.json
          grep "version" package.json | head -1
          grep -A5 "remote_binary" package.json

      - name: Commit and tag release
        if: steps.version.outputs.is_release == 'true'
        run: |
          git config user.name "konst2"
          git config user.email "konst2@users.noreply.github.com"

          if git diff --quiet package.json; then
            echo "No changes to package.json"
          else
            git add package.json
            git commit -m "chore: update package.json for release ${{ steps.version.outputs.version }}

          - Set remote_binary URL to ${{ steps.version.outputs.version }}
          - Set SHA256 hash to ${{ steps.dependencies_hash.outputs.sha256 }}"

            git push origin HEAD:main
          fi

          git tag -fa "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}" --force

      - name: Update package.json for dev build
        if: steps.version.outputs.is_release != 'true'
        run: |
          sed -i -E "s#/download/(__VERSION__|v?[0-9]+\.[0-9]+\.[0-9]+|dev-[a-f0-9]+)/#/download/${{ steps.version.outputs.version }}/#g" package.json
          sed -i -E "s#\"sha256hash\": \"(__SHA256__|[a-f0-9]{64})\"#\"sha256hash\": \"${{ steps.dependencies_hash.outputs.sha256 }}\"#g" package.json
          grep -A5 "remote_binary" package.json

      - name: Build plugin with Decky CLI
        run: |
          cli/decky plugin build $(pwd) -o ./out

      - name: Repack zip with kebab-case inner folder
        run: |
          cd out
          # CLI names the zip after plugin.json "name" (may contain spaces, e.g. "Decky Translator RU.zip")
          ZIP_FILE=$(ls *.zip | head -1)
          echo "CLI produced zip: $ZIP_FILE"
          mkdir _staging
          unzip -q "$ZIP_FILE" -d _staging
          INNER_DIR=$(find _staging -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "Inner folder: $INNER_DIR"
          mv "$INNER_DIR" _staging/decky-translator-ru
          rm "$ZIP_FILE"
          (cd _staging && zip -qr "../DeckyTranslatorRu.zip" decky-translator-ru)
          rm -rf _staging
          unzip -l "DeckyTranslatorRu.zip" | head -5

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: decky-translator-ru-plugin
          path: out/*.zip

      - name: Upload dependencies artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-dependencies
          path: plugin-dependencies.tar.xz

  release:
    if: needs.build.outputs.is_release == 'true'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v8
        with:
          name: decky-translator-ru-plugin
          path: ./
          merge-multiple: true

      - name: Download dependencies artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin-dependencies
          path: ./
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            DeckyTranslatorRu.zip
            plugin-dependencies.tar.xz
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
